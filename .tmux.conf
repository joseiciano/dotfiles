set-option -g default-shell /bin/zsh

# Bind Prefix
unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix
set-option -g prefix C-`
bind-key C-` send-prefix

bind r source-file ~/dotfiles/.tmux.conf \; display "Reloaded!"

set -g detach-on-destroy off

# Trigger tmux menu
set -g @tmux-which-key-config-path "~/dotfiles/.tmux/plugins/tmux-which-key/config.yaml"
bind-key -n  C-a run-shell "tmux show-wk-menu-root"

# tmux-sensible overrides
set -s escape-time 0 # Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -g history-limit 50000 # Increase scrollback buffer size from 2000 to 50000 lines
set -g display-time 4000 # Increase tmux messages display duration from 750ms to 4s
set -g status-interval 8 # Refresh 'status-left' and 'status-right' more often, from every 15s to 8s
set -g default-terminal "screen-256color" # (macOS only) Upgrade $TERM to 256color if talloc is installed
set -g focus-events on # (macOS only) Upgrade $TERM to 256color if talloc is installed
setw -g aggressive-resize on # Used for multi-monitor displays 

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

unbind -T copy-mode-vi MouseDragEnd1Pane

# Copy (yank) with 'y' instead of enter
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Optional: Use 'V' to select the whole line
bind-key -T copy-mode-vi V send-keys -X select-line

# Optional: Use 'C-v' for rectangle select (block mode)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind v copy-mode

# # #
# General Settings
# # #
# Change base panels 
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

set -g mouse on 
set-window-option -g mode-keys vi

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# General statusline customisation
set -g status-style 'bg=terminal'

###
# Theme
###
## Configure the catppuccin plugin <https://github.com/catppuccin/tmux>
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato, mocha

# status left style
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_blue}]  #{=/-32/...:#{s|.*/([^/]+/[^/]+)$|\\1|:#{s|/Users/$USER|~|:#{s|/home/$USER|~|:pane_current_path}}}} "

# set -g status-justify "left"
set-option -g status-position top

# status right style
set -g status-right-length 100
set -g status-right ""

# Other indicators
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0}, none]"
set -ga status-right "#[bg=#{@thm_mantle},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# window style
set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator '|'
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags ""
set -g @catppuccin_window_number ""
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},},: #W ,}"
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W ,}"

###
# End of Theme
###

