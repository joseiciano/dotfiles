# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# after-startup-command = [
#   'exec-and-forget borders active_color=0xffea9999 inactive_color=0xff494d64 width=5.0'
# ]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
# Inside ~/.aerospace.toml
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'f=$(aerospace list-workspaces --focused); aerospace list-workspaces --monitor all --visible | tail -r | awk -v focused="$f" "{ val = (\$1 == focused) ? \"*\"\$1 : \$1; printf (NR==1 ? \"(\"val : \" | \"val) } END { printf \")\" }" > ~/dotfiles/.state/aerospace_status.txt && tmux set-option -g status-left-length 101',
]

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# Main screen 
[[on-window-detected]]
if.app-id = 'com.docker.docker'
run = ['move-node-to-workspace terminal', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace terminal', 'layout accordion']

# Secondary
[[on-window-detected]]
if.app-id = 'com.microsoft.edgemac'
run = 'move-node-to-workspace browser'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace browser'

[[on-window-detected]]
if.app-id = 'com.wizards.mtga'
run = ['move-node-to-workspace games', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam'
run = ['move-node-to-workspace games', 'layout accordion']

[[on-window-detected]]
if.app-id = 'gg.untapped.companion'
run = ['move-node-to-workspace games', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.pdfeditor.pdfeditormac'
run = 'move-node-to-workspace pdf'

[[on-window-detected]]
if.app-id = 'com.blackmagic-design.DaVinciResolve'
run = ['move-node-to-workspace video-editing', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.autocut'
run = ['move-node-to-workspace video-editing', 'layout accordion']

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
#
# # All possible modifiers: cmd, alt, ctrl, shift

# Top level layer, used for most important commands + going to keytables
[mode.main.binding]
# Go to specific key tables
alt-ctrl-a = 'mode table'
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-tab = 'workspace-back-and-forth'
alt-w = 'fullscreen'

[mode.table.binding]
esc = 'mode main'
w = 'mode go_to_window'
m = 'mode move_window'
r = 'mode resize_window'

[mode.go_to_window.binding]
t = ['move-node-to-workspace terminal', 'mode main']
m = ['move-node-to-workspace misc', 'mode main']
b = ['move-node-to-workspace browser', 'mode main']
p = ['move-node-to-workspace pdf', 'mode main']
g = ['move-node-to-workspace games', 'mode main']
v = ['move-node-to-workspace video-editing', 'mode main']

[mode.move_window.binding]
h = ['move left', 'mode main']
j = ['move down', 'mode main']
k = ['move up', 'mode main']
l = ['move right', 'mode main']

shift-h = ['join-with left', 'mode main']
shift-j = ['join-with down', 'mode main']
shift-k = ['join-with up', 'mode main']
shift-l = ['join-with right', 'mode main']

[mode.resize_window.binding]
m = ['resize smart -50', 'mode main']
p = ['resize smart +50', 'mode main']

f = ['layout floating tiling', 'mode main']
t = ['layout tiles horizontal vertical', 'mode main']
a = ['layout accordion horizontal vertical', 'mode main']

[workspace-to-monitor-force-assignment]
terminal = 'main'
misc = 'main'
browser = 'secondary'
pdf = 'secondary'
games = 'secondary'
video-editing = 'main'
