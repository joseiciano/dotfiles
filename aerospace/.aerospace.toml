# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# after-startup-command = [
#   'exec-and-forget borders active_color=0xffea9999 inactive_color=0xff494d64 width=5.0'
# ]
#

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
# Inside ~/.aerospace.toml
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'f=$(aerospace list-workspaces --focused); aerospace list-workspaces --monitor all --visible | tail -r | awk -v focused="$f" "{ val = (\$1 == focused) ? \"*\"\$1 : \$1; printf (NR==1 ? \"(\"val : \" | \"val) } END { printf \")\" }" > ~/dotfiles/.state/aerospace_status.txt && tmux set-option -g status-left-length 101',
]

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 16
inner.vertical = 16
outer.left = 16
outer.bottom = 16
outer.top = 16
outer.right = 16

# 1. Set all windows to float by default
[[on-window-detected]]
check-further-callbacks = true
run = ['layout floating']

# 2. Force specific browsers to tile
# Main screen 
[[on-window-detected]]
if.app-id = 'com.docker.docker'
run = ['move-node-to-workspace terminal', 'layout accordion']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace terminal', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['layout tiling']

[[on-window-detected]]
if.app-id = 'com.microsoft.edgemac'
run = ['layout tiling']

# Secondary
# [[on-window-detected]]
# if.app-id = 'com.google.Chrome'
# run = ['move-node-to-workspace terminal', 'layout tiling']
#
# [[on-window-detected]]
# if.app-id = 'com.microsoft.edgemac'
# run = ['move-node-to-workspace terminal', 'layout tiling']

[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam'
run = ['move-node-to-workspace games', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.epicgames.EpicGamesLauncher'
run = ['move-node-to-workspace games', 'layout floating']

[[on-window-detected]]
if.app-id = 'com.pdfeditor.pdfeditormac'
run = 'move-node-to-workspace pdf'
#
[[on-window-detected]]
if.app-id = 'com.blackmagic-design.DaVinciResolve'
run = ['move-node-to-workspace video-editing']

[[on-window-detected]]
if.app-id = 'com.autocut'
run = ['move-node-to-workspace video-editing', 'layout floating']

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
#
# # All possible modifiers: cmd, alt, ctrl, shift

# Top level layer, used for most important commands + going to keytables
[mode.main.binding]
# Layout changes
alt-space = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-semicolon = 'layout accordion horizontal vertical'

# Focusing Windows
alt-h = ['focus --boundaries-action wrap-around-the-workspace left']
alt-j = ['focus --boundaries-action wrap-around-the-workspace down']
alt-k = ['focus --boundaries-action wrap-around-the-workspace up']
alt-l = ['focus --boundaries-action wrap-around-the-workspace right']

alt-left = ['focus --boundaries-action wrap-around-the-workspace left']
alt-down = ['focus --boundaries-action wrap-around-the-workspace down']
alt-up = ['focus --boundaries-action wrap-around-the-workspace up']
alt-right = ['focus --boundaries-action wrap-around-the-workspace right']

# Move Windows in workspace
ctrl-alt-shift-cmd-h = ['move left']
ctrl-alt-shift-cmd-j = ['move up']
ctrl-alt-shift-cmd-k = ['move down']
ctrl-alt-shift-cmd-l = ['move right']

ctrl-alt-shift-cmd-left = ['move left']
ctrl-alt-shift-cmd-up = ['move up']
ctrl-alt-shift-cmd-down = ['move down']
ctrl-alt-shift-cmd-right = ['move right']

# Join Windows
alt-shift-cmd-h = ['join-with left']
alt-shift-cmd-j = ['join-with up']
alt-shift-cmd-k = ['join-with down']
alt-shift-cmd-l = ['join-with right']

alt-shift-cmd-left = ['join-with left']
alt-shift-cmd-up = ['join-with up']
alt-shift-cmd-down = ['join-with down']
alt-shift-cmd-right = ['join-with right']

alt-shift-cmd-f = ['flatten-workspace-tree', 'mode main']

# Move Windows to workspace
ctrl-alt-shift-cmd-t = ['move-node-to-workspace terminal', 'workspace terminal']
ctrl-alt-shift-cmd-m = ['move-node-to-workspace misc', 'workspace misc']
ctrl-alt-shift-cmd-p = ['move-node-to-workspace pdf', 'workspace pdf']
ctrl-alt-shift-cmd-g = ['move-node-to-workspace games', 'workspace games']
ctrl-alt-shift-cmd-v = [
  'move-node-to-workspace video-editing',
  'workspace video-editing',
]

# Go to last workspace 
alt-tab = ['workspace-back-and-forth', 'mode main']

# Resize
alt-w = ['fullscreen']
ctrl-alt-shift-cmd-n = ['resize smart -50']
ctrl-alt-shift-cmd-b = ['resize smart +50']

# Go-to workspace
alt-t = ['workspace terminal', 'mode main']
alt-m = ['workspace misc', 'mode main']
alt-b = ['workspace browser', 'mode main']
alt-p = ['workspace pdf', 'mode main']
alt-g = ['workspace games', 'mode main']
alt-v = ['workspace video-editing', 'mode main']

[workspace-to-monitor-force-assignment]
terminal = 'main'
misc = 'main'
pdf = 'secondary'
games = 'secondary'
video-editing = 'main'
